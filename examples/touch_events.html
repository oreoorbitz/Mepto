<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0"
    />
    <title>Mepto — touch events demo</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        padding: 24px;
      }
      .delete {
        display: none;
        color: red;
        margin-left: 8px;
        cursor: pointer;
      }
      #items li {
        padding: 8px 0;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <ul id="items">
      <li>List item 1 <span class="delete">DELETE</span></li>
      <li>List item 2 <span class="delete">DELETE</span></li>
      <li>List item 3 <span class="delete">DELETE</span></li>
      <li>List item 4 <span class="delete">DELETE</span></li>
    </ul>
    <p style="color: #666; font-size: 0.9rem; margin-bottom: 16px">
      Swipe an item to reveal DELETE. On desktop without touch, click the item instead. Tap/click
      DELETE to remove it.
    </p>
    <script type="module">
      import { $ } from '../src/meptos.ts'

      const showDelete = function () {
        $('.delete').hide()
        $('.delete', this).show()
      }

      // Touch/pointer swipe (Mepto touch handles touch + pen, not mouse)
      $('#items li').on('swipe', showDelete)

      // Desktop fallback: click also reveals delete (tap is touch-only)
      $('#items li').on('click', function (e) {
        // If swipe already handled (touch), skip duplicate click
        if ('ontouchstart' in document) return
        showDelete.call(this, e)
      })

      // tap for touch, click for mouse
      $('.delete').on('tap click', function () {
        $(this).closest('li').remove()
      })
    </script>
  </body>
</html>
