<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Load fallback if Mepto not supported</title>
  </head>
  <body>
    <h1>Mepto with fallback</h1>
    <p>
      Legacy Zepto example checked <code>'__proto__' in {}</code> to decide between Zepto and jQuery
      1.7. Mepto targets evergreen browsers only — that check is obsolete.
    </p>
    <script type="module">
      import { $ } from '../src/meptos.ts'
      $('body').append('<p>Hello from Mepto ' + ($.fn ? 'ready' : 'missing') + '!</p>')
      $('script').each(function (_i, script) {
        if ((script as HTMLScriptElement).src)
          $('<p>&lt;script src="' + (script as HTMLScriptElement).src + '"&gt;</p>').appendTo('body')
      })
    </script>
  </body>
</html>
