<!DOCTYPE html>
<html>
<head>
  <title>Load jQuery if mepto is not supported</title>
</head>
<body>
  <h1>Load jQuery if mepto is not supported</h1>
</body>
<script>document.write('<script src='+('__proto__' in {} ? '../dist/mepto' : 'https://ajax.googleapis.com/ajax/libs/jquery/1.7.1/jquery')+'.js><\/script>')</script>
<script>
  $('body').append('<p>Hello from '+('mepto' in window ? 'mepto' : 'jQuery')+'!</p>')

  $('script').each(function(index,script){
    if (script.src)
      $('<p>&lt;script src="'+script.src+'"&gt;</p>').appendTo('body')
  })
</script>
</html>
