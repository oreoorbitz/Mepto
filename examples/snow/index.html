<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Let it snow with Mepto</title>
    <style>
      body {
        background: #000;
        color: #fff;
        overflow: hidden;
        margin: 0;
      }
      body > div {
        position: absolute;
      }
    </style>
  </head>
  <body>
    <a
      href="https://twitter.com/share"
      class="twitter-share-button"
      data-url="http://meptojs.com/let-it-snow"
      data-text="Let it snow with Mepto"
      data-via="meptojs"
      data-lang="en"
      >Tweet</a
    >
    <script>
      !(function (d, s, id) {
        var js,
          fjs = d.getElementsByTagName(s)[0]
        if (!d.getElementById(id)) {
          js = d.createElement(s)
          js.id = id
          js.src = '//platform.twitter.com/widgets.js'
          fjs.parentNode.insertBefore(js, fjs)
        }
      })(document, 'script', 'twitter-wjs')
    </script>
    <script type="module">
      import { $ } from '../../src/meptos.ts'

      $(() => {
        let i = 100
        const glyphs = '❄❅❆'.split('')

        const rand = max => Math.floor(Math.random() * max)

        function addFlake() {
          const el = $('<div><div>' + glyphs[rand(glyphs.length)] + '</div></div>')
          $('body').append(el)
          el.css({ left: rand(100) + '%', top: -100 - rand(500), fontSize: 20 + rand(30) })
          // Mepto animate duration is ms (Zepto legacy used seconds, so 6-16s => 6000-16000ms)
          el.animate(
            {
              translateY: 1500 + rand(500) + 'px',
              translateX: 50 - rand(100) + 'px',
              rotate: 2e3 - rand(4e3) + 'deg',
            },
            (6 + rand(10)) * 1000,
            'linear',
            function () {
              addFlake()
              el.remove()
            }
          )
        }

        while (i--) addFlake()
      })
    </script>
  </body>
</html>
