<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mepto — anim demo</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        padding: 40px;
      }
      #box {
        width: 100px;
        height: 100px;
        border: 1px solid #000;
        display: grid;
        place-items: center;
      }
    </style>
  </head>
  <body>
    <div id="box">HELLO WORLD</div>
    <script type="module">
      import { $ } from '../src/meptos.ts'
      // Mepto animate duration is in ms (Zepto legacy used seconds, so 2s => 2000ms)
      $('#box').animate({ rotate: '720deg', opacity: 0.5 }, 2000, 'ease-out')
    </script>
  </body>
</html>
