<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>iPhone — Mepto</title>
    <link href="iphone.css" media="screen" rel="stylesheet" type="text/css" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="format-detection" content="telephone=no" />
  </head>
  <body>
    <section id="menu">
      <div class="toolbar"><h1>Title</h1></div>
      <ul class="menu">
        <li class="arrow"><a href="#menu_1">Menu 1</a></li>
        <li>Menu 1</li>
        <li>Menu 1</li>
        <li>Menu 1</li>
        <li>Menu 1</li>
      </ul>
    </section>
    <section id="menu_1">
      <div class="toolbar"><h1>Menu 1</h1></div>
      <ul class="menu">
        <li>SubMenu 1</li>
        <li>SubMenu 2</li>
      </ul>
    </section>
    <script type="module">
      import { $ } from '../../src/meptos.ts'

      $(() => {
        const activate = 'createTouch' in document ? 'touchstart' : 'click'

        $('body > section').first().addClass('current')

        // Zepto .live() -> Mepto delegated .on()
        $(document).on(activate, 'a.back', function () {
          const current = $(this).attr('href')
          $('.current').removeClass('current').addClass('reverse')
          $(current).addClass('current')
        })

        $(document).on(activate, '.menu a[href]', function () {
          const link = $(this)
          const section = link.closest('section')
          const prev_element = '#' + section.removeClass('current').addClass('reverse').attr('id')
          $(link.attr('href')).addClass('current')
          $('.current .back').remove()
          $('.current .toolbar').prepend('<a href="' + prev_element + '" class="back">Back</a>')
        })
      })
    </script>
  </body>
</html>
